# Tự đóng gói phần mềm thành file .exe cho Windows.
# Chạy khi đẩy một thẻ phiên bản (ví dụ v2.1.0) hoặc khi bấm "Run workflow" trong tab Actions.
name: Đóng gói ứng dụng Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Đóng gói file exe
        run: npm run dist

      - name: Lưu file exe vào kết quả chạy
        uses: actions/upload-artifact@v7
        with:
          name: QR-Studio-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Đính file exe vào bản phát hành
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          generate_release_notes: true
